name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs the reduced configuration: tiny models, few epochs, small
  # samples. This is what makes executing all eleven notebooks affordable in CI
  # while leaving the versions students receive untouched.
  AI_POWER_COURSE_FAST: "1"
  # Keep BLAS from oversubscribing the runner's two cores.
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # Lint only. The notebook sources use deliberate manual layout (aligned
      # table literals, plot calls broken to mirror the figure) that the
      # formatter would reflow into something harder to read, so the project is
      # not formatter-managed.
      - run: uv run ruff check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile, as a student would
        run: uv sync --locked
      - name: Show what was installed
        run: uv run python -c "import torch, pandapower, transformers, sklearn; print(torch.__version__, pandapower.__version__, transformers.__version__, sklearn.__version__)"
      - run: uv run pytest -q

  notebooks:
    name: execute notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Split across jobs so a failure points at a specific notebook and the
        # wall-clock stays reasonable. The groups are balanced by runtime.
        group:
          - "01_ 02_ 03_ 04_"
          - "05_ 06_ 07_"
          - "08_ 09_ 10_"
          # Tutorial 11 is optional/advanced and the heaviest of the set
          # (a Flower simulation plus federated graph pretraining), so it
          # gets its own group rather than lengthening an existing one.
          - "11_"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Execute notebooks (reduced configuration)
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'scripts')
          from build_notebooks import build
          raise SystemExit(build(only=tuple('${{ matrix.group }}'.split()), fast=True))
          "

      - name: Fail if any notebook produced an error output
        run: uv run pytest tests/test_project.py -q -k "built_notebook"

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-${{ strategy.job-index }}
          path: tutorials/*.ipynb
          retention-days: 7

  exercises:
    name: execute the solution notebook
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      # The solution notebook is the contract: if a worked answer no longer
      # runs, a student would find out before the instructor does.
      - name: Rebuild and execute both notebooks
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'scripts')
          from build_exercise_notebooks import build
          build(do_execute=True, timeout=1800)
          "

      - name: Exercise and solution must still be in sync
        run: uv run pytest tests/test_exercises.py -q

      - name: Upload the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-notebooks
          path: |
            tutorials/exercise.ipynb
            tutorials/solution.ipynb
          retention-days: 7

  fresh-install:
    name: fresh install from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Resolve and install with no cache at all
        run: uv sync --locked --no-cache
      - name: The two commands the README promises
        run: |
          uv run pytest -q
          uv run python -c "
          from ai_power_course.data import load_energy_data
          from ai_power_course.grid.networks import network_summary
          print(load_energy_data().describe())
          print(network_summary(('case9', 'case14')).to_string())
          "
